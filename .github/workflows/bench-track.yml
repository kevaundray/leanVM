name: Track benchmarks

# Uploads what a successful Bench run (bench.yml) saved to Bencher, with the secret
# `BENCHER_API_KEY` and the variable `BENCHER_PROJECT` (the project slug); unset,
# nothing is uploaded. Bencher's pattern for fork PRs: a fork's run has no secrets, and
# this workflow has them but never runs the PR's code, only reads its JSON. GitHub runs
# a `workflow_run` workflow only from the default branch.
#
# A PR's results go to the Bencher branch `pr/<number>`, started from its base branch
# at the base commit with the base's thresholds, and Bencher comments on the PR. A push
# to a tracked branch sets that branch's thresholds: any cycles increase on
# ubuntu-latest fails, a proving machine's latency alerts only report. The PR's run
# wrote everything read here, so a fork's results are the fork's word: they inform a
# review and gate nothing.

on:
  workflow_run:
    workflows: [ Bench ]
    types: [ completed ]

permissions: {}

jobs:
  track:
    name: Track
    if: github.event.workflow_run.conclusion == 'success' && vars.BENCHER_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results
      - uses: bencherdev/bencher@main
      - name: Upload to Bencher
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tracked=false
          if [ "$EVENT" = pull_request ]; then
            event=results/pr-event/event.json
            number=$(jq -r .number "$event")
            [[ $number =~ ^[0-9]+$ ]] || { echo "not a PR number: $number"; exit 1; }
            branch=(--branch "pr/$number" --hash "$(jq -r .pull_request.head.sha "$event")"
              --start-point "$(jq -r .pull_request.base.ref "$event")"
              --start-point-hash "$(jq -r .pull_request.base.sha "$event")"
              --start-point-clone-thresholds --start-point-reset --ci-number "$number")
          elif [ "$HEAD_BRANCH" = main ] || [ "$HEAD_BRANCH" = riscv-exploration ]; then
            tracked=true
            branch=(--branch "$HEAD_BRANCH" --hash "$HEAD_SHA")
          else
            branch=(--branch "$HEAD_BRANCH" --hash "$HEAD_SHA"
              --start-point main --start-point-clone-thresholds --start-point-reset)
          fi
          for dir in results/bench-*/; do
            testbed=$(basename "$dir")
            testbed=${testbed#bench-}
            [[ $testbed =~ ^[A-Za-z0-9_-]+$ ]] || { echo "not a testbed name: $testbed"; exit 1; }
            args=()
            if [ "$testbed" = ubuntu-latest ]; then
              # Exact counts: any increase is a regression.
              thresholds=(--threshold-measure cycles --threshold-test percentage
                --threshold-max-sample-size 1 --threshold-upper-boundary 0.0)
              args+=(--error-on-alert)
            else
              # Reported, not failed on, until each machine's noise is known.
              thresholds=(--threshold-measure latency --threshold-test t_test
                --threshold-max-sample-size 64 --threshold-upper-boundary 0.99)
            fi
            if [ "$tracked" = true ]; then
              args+=("${thresholds[@]}" --thresholds-reset)
            fi
            bencher run \
              --project "$BENCHER_PROJECT" \
              --key "$BENCHER_API_KEY" \
              --testbed "$testbed" \
              "${branch[@]}" \
              "${args[@]}" \
              --adapter json \
              --file "${dir}bench.json" \
              --github-actions "$GITHUB_TOKEN"
          done
