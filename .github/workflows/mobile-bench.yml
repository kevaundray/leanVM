name: Mobile benchmarks

on:
  pull_request:
  push:
    branches: [kw/mobile-bench-browserstack]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-bench-${{ github.event_name == 'pull_request' && github.ref || 'browserstack' }}
  cancel-in-progress: false

env:
  RUSTFLAGS: -C target-cpu=generic
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'

jobs:
  android:
    name: Android ARM64 release
    if: >-
      github.event_name == 'pull_request' ||
      ((github.repository == 'kevaundray/leanVM' || github.repository == 'leanEthereum/leanVM') &&
       ((github.event_name == 'schedule' &&
         (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/riscv-exploration')) ||
        (github.event_name == 'workflow_dispatch' &&
         (github.ref == 'refs/heads/riscv-exploration' || github.ref == 'refs/heads/kw/mobile-bench-browserstack')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/kw/mobile-bench-browserstack')))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: bench-mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'schedule' && 'riscv-exploration' || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
      - name: Select Java and install pinned Android packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          export GRADLE_USER_HOME="$RUNNER_TEMP/mobile-bench-gradle"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$GRADLE_USER_HOME"
          printf 'org.gradle.workers.max=2\norg.gradle.daemon=false\n' > "$GRADLE_USER_HOME/gradle.properties"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.5'
          cache-disabled: true
          add-job-summary: never
          dependency-graph: disabled
      - name: Install pinned host tools
        env:
          RUSTFLAGS: ''
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --rev 217cfd4f78db1284276a1a1da44e3bf473729f5c --locked
      - name: Compile optional NEON crypto kernels
        env:
          RUSTFLAGS: -C target-cpu=generic -C target-feature=+aes,+sha3
        run: cargo check --target aarch64-linux-android --release --locked --lib
      - name: Build baseline ARM64 runner and test APKs without credentials
        run: |
          python3 ../scripts/mobile-bench-package.py shielded_prove
      - name: Save credential-free release packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobile-bench-android-packages
          path: bench-mobile/target/mobile-bench-packages/
          if-no-files-found: error
          retention-days: 7
      - name: Validate candidate device and run trusted benchmarks
        if: >-
          (github.repository == 'kevaundray/leanVM' || github.repository == 'leanEthereum/leanVM') &&
          ((github.event_name == 'schedule' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/riscv-exploration')) ||
           (github.event_name == 'workflow_dispatch' &&
            (github.ref == 'refs/heads/riscv-exploration' || github.ref == 'refs/heads/kw/mobile-bench-browserstack')))
        timeout-minutes: 65
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: python3 ../scripts/mobile-bench-run.py
      - name: Save sanitized results and provenance
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobile-bench-android-results
          path: bench-mobile/target/mobile-bench-results/
          if-no-files-found: warn
          retention-days: 30
