name: Recursion builder model

# The Lean model of the recursion circuit's builder (verification/circuits/LeanVMCircuits/Rec/Builder.lean)
# replays the builder calls that make each tracked aggregation tree's circuits and checks it builds the same
# circuits. Any Rust change can change what the verifier in rows calls, so every one runs it.

on:
  pull_request:
    paths:
      - crates/**
      - bins/leanvm/**
      - programs/**
      - Cargo.toml
      - Cargo.lock
      - verification/circuits/**
      - .github/workflows/rec-builder-model.yml
  push:
    branches: [riscv-exploration, 'kw/clean-circuits-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/circuits
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Dump the tracked circuits and instruction table bindings
        run: cargo run --release -p leanvm-cli --features circuits -- circuits /tmp/circuits
      - name: Replay the builders and check native table bindings
        working-directory: verification/circuits
        run: |
          lake exe cache get Mathlib.Tactic Mathlib.FieldTheory.Finite.Extension Mathlib.RingTheory.AdjoinRoot Mathlib.Algebra.Polynomial.SpecificDegree Mathlib.Algebra.MvPolynomial.Eval Mathlib.Algebra.Polynomial.Roots Mathlib.Algebra.BigOperators.Field Mathlib.Algebra.Order.BigOperators.Group.Finset Mathlib.Algebra.Order.Field.Rat Mathlib.Data.Fintype.Card
          lake build checkrec checkflushes checkbind checkedges
          lake exe checkrec /tmp/circuits/*.txt
          lake exe checkflushes /tmp/circuits/table-flushes.dump
      - name: Check transcript binding
        working-directory: verification/circuits
        run: |
          lake exe checkbind /tmp/circuits/*.txt
          # A circuit from before the union absorbed its begin bits (#626): its coverage test must stay unbound.
          xz -dc fixtures/pre626-claimset-two-tier-circuit-1.txt.xz > /tmp/pre626-claimset-two-tier-circuit-1.txt
          lake exe checkbind --expect-unbound /tmp/pre626-claimset-two-tier-circuit-1.txt
      - name: Check the tree's edges
        working-directory: verification/circuits
        run: lake exe checkedges /tmp/circuits/*.txt
