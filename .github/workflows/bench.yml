name: Bench
on:
  workflow_dispatch:
    inputs:
      base:
        default: f52bd991c8623894e7b03a2e50bede6c248ea1ad
      head:
        required: false
permissions:
  contents: read
jobs:
  round1:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: size-attester7870-x64
          - arch: arm64
            runner: size-attester7870-arm64
    runs-on: [self-hosted-ghr, '${{ matrix.runner }}']
    timeout-minutes: 60
    env:
      BASE: '${{ inputs.base }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.head }}'
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Paired Round1 experiment
        run: python3 scripts/round1-hardware.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round1-${{ matrix.arch }}
          path: round1-evidence/
