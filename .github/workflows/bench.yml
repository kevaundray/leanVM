name: Bench

# Runs the benchmarks and saves each testbed's Bencher Metric Format JSON as the artifact
# `bench-<testbed>`, with a PR's event as `pr-event`. It holds no secret, so it runs the
# same for a fork's PR: bench-track.yml uploads the results once this succeeds.
# - variable `BENCH_TESTBEDS`: the machines to prove on, as a JSON array of
#   {"name", "runner"}, the runner's labels, e.g.
#   [{"name": "github-ubuntu", "runner": "ubuntu-latest"},
#    {"name": "zen5", "runner": ["self-hosted", "zen5"]}].
#   A runner given as one `ubuntu-*`, `windows-*` or `macos-*` label is GitHub-hosted;
#   any other is self-hosted. Unset, no proving job runs.
# A PR proves when labelled `bench`, which a maintainer adds after reading it. A fork's PR
# proves on GitHub-hosted testbeds only, a throwaway machine with no secrets; a
# self-hosted one would run the fork's code on our hardware. That choice is made here,
# and a fork's PR runs its own copy of this file, so the self-hosted runners' own
# settings (a runner group limited to this repository's workflows on `main` and
# `riscv-exploration`, and approval for outside contributors' runs) are what enforce it.

on:
  push:
    # The branches PRs target: their history is what a PR is compared against.
    branches: [ "main", "riscv-exploration" ]
  pull_request:
    # Not `edited`: a description edit would restart, and so cancel, the PR's run.
    types: [ opened, reopened, synchronize, labeled ]
  workflow_dispatch:

permissions:
  contents: read

# A label other than `bench` starts a run that proves nothing: it must not
# cancel the PR's real run.
concurrency:
  group: bench-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # What bench-track.yml needs to name the PR's Bencher branch and its start point.
  event:
    name: PR event
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: pr-event
          path: ${{ github.event_path }}

  # The testbeds this event may prove on, as the matrix of `prove`.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      testbeds: ${{ steps.plan.outputs.testbeds }}
    steps:
      - id: plan
        env:
          TESTBEDS: ${{ vars.BENCH_TESTBEDS || '[]' }}
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'bench') }}
          # A `labeled` event for another label proves nothing: the PR's own run does.
          OTHER_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name != 'bench' }}
        run: |
          if [ "$EVENT" = pull_request ] && { [ "$LABELLED" != true ] || [ "$OTHER_LABEL" = true ]; }; then
            testbeds='[]'
          elif [ "$FORK" = true ]; then
            testbeds=$(jq -c '[.[] | select(.runner | type == "string" and test("^(ubuntu|windows|macos)-"))]' <<<"$TESTBEDS")
          else
            testbeds=$(jq -c . <<<"$TESTBEDS")
          fi
          echo "testbeds=$testbeds" >> "$GITHUB_OUTPUT"
          echo "Testbeds: $testbeds"

  prove:
    name: Prove (${{ matrix.testbed.name }})
    needs: plan
    if: needs.plan.outputs.testbeds != '[]'
    runs-on: ${{ matrix.testbed.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testbed: ${{ fromJSON(needs.plan.outputs.testbeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Built with the pinned `target-cpu=native`: one cache per machine.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.testbed.name }}
      - name: Prove flock's hash batch
        env:
          FLOCK_N_LOG: 18
          BENCH_REPEAT: 5
        run: cargo bench -p flock --bench hash_batch -- --json > bench.json && cat bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.testbed.name }}
          path: bench.json
