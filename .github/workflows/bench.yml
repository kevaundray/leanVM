name: Bench

# Runs the benchmarks and saves each testbed's Bencher Metric Format JSON as the artifact
# `bench-<testbed>`, with a PR's event as `pr-event`. It holds no secret, so it runs the
# same for a fork's PR: bench-track.yml uploads the results once this succeeds.
# The testbeds:
# - `github-ubuntu`, GitHub's `ubuntu-latest`, on every push and every PR, forks included:
#   a throwaway machine with no secrets. It is named here because a fork's PR runs
#   without the repository's variables.
# - variable `BENCH_TESTBEDS`: the self-hosted machines, as a JSON array of
#   {"name", "runner"}, the runner's labels, e.g.
#   [{"name": "zen5", "runner": ["self-hosted", "zen5"]}]. On pushes, and on a PR from this
#   repository once a maintainer labels it `bench`; never on a fork's PR, which would run
#   its code on our hardware. A fork's PR runs its own copy of this file, so the
#   self-hosted runners' own settings (a runner group limited to this repository's
#   workflows on `main` and `riscv-exploration`, and approval for outside contributors'
#   runs) are what keep it off them.

on:
  push:
    # The branches PRs target: their history is what a PR is compared against.
    branches: [ "main", "riscv-exploration" ]
  pull_request:
    # Not `edited`: a description edit would restart, and so cancel, the PR's run.
    types: [ opened, reopened, synchronize, labeled ]
  workflow_dispatch:

permissions:
  contents: read

# A `labeled` event starts a run of its own, which must not cancel the PR's.
concurrency:
  group: bench-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # What bench-track.yml needs to name the PR's Bencher branch and its start point.
  event:
    name: PR event
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: pr-event
          path: ${{ github.event_path }}

  # The testbeds this event may prove on, as the matrix of `prove`.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      testbeds: ${{ steps.plan.outputs.testbeds }}
    steps:
      - id: plan
        env:
          HOSTED: '[{"name": "github-ubuntu", "runner": "ubuntu-latest"}]'
          SELF_HOSTED: ${{ vars.BENCH_TESTBEDS || '[]' }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'bench') }}
        run: |
          all=$(jq -cn --argjson a "$HOSTED" --argjson b "$SELF_HOSTED" '$a + $b | unique_by(.name)')
          if [ "$EVENT" != pull_request ]; then
            testbeds=$all
          elif [ "$ACTION" = labeled ]; then
            # The PR's own run proved on github-ubuntu: `bench` on a PR from this repository
            # adds the self-hosted machines, and any other label proves nothing.
            if [ "$LABEL" = bench ] && [ "$FORK" != true ]; then testbeds=$SELF_HOSTED; else testbeds='[]'; fi
          elif [ "$LABELLED" = true ] && [ "$FORK" != true ]; then
            testbeds=$all
          else
            testbeds=$HOSTED
          fi
          echo "testbeds=$testbeds" >> "$GITHUB_OUTPUT"
          echo "Testbeds: $testbeds"

  prove:
    name: Prove (${{ matrix.testbed.name }})
    needs: plan
    if: needs.plan.outputs.testbeds != '[]'
    runs-on: ${{ matrix.testbed.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testbed: ${{ fromJSON(needs.plan.outputs.testbeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Built with the pinned `target-cpu=native`: one cache per machine.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.testbed.name }}
      - name: Prove flock's hash batch
        env:
          FLOCK_N_LOG: 18
          BENCH_REPEAT: 5
        run: cargo bench -p flock --bench hash_batch -- --json > bench.json && cat bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.testbed.name }}
          path: bench.json
