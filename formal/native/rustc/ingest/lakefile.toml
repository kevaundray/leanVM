name = "ingest"
version = "0.1.0"
defaultTargets = ["ingest-arm", "ingest-x64"]

# Kraken's assembly parsers, which need this toolchain (formal/native's Lean does not build them). The same
# pin as formal/native's (kevaundray/kraken `leanvm-pin`).
[[require]]
name = "Kraken"
git = "https://github.com/kevaundray/kraken"
rev = "6930e39c710ac5e5307612e985f97520858023ab"

# The ingestion, generic in the architecture (IngestCore.lean).
[[lean_lib]]
name = "IngestCore"

# rustc's assembly for the signature verifiers, parsed with Kraken's parsers and written as Lean modules of
# formal/native: AArch64 (IngestArm.lean) and x86-64 (IngestX64.lean), two executables because Kraken's two
# architectures declare the same root names.
[[lean_exe]]
name = "ingest-arm"
root = "IngestArm"
supportInterpreter = true

[[lean_exe]]
name = "ingest-x64"
root = "IngestX64"
supportInterpreter = true
