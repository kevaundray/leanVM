[package]
name = "groth16-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
groth16 = { path = "../guest" }
leanvm_guest.workspace = true
# The calldata's points are compressed: their square roots, as the contract takes them.
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }

[dev-dependencies]
ark-ec = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
leanvm_core.workspace = true
primitives.workspace = true
